# 麻薯背单词推送服务 —— nginx 转发配置
#
# 把下面两个 location 粘贴进【已有的】mle.doge6.com 的 server { ... } 块里面：
#   - 如果用了 HTTPS（certbot），要放进 `listen 443 ssl` 的那个 server 块（不是只做 301 跳转的 80 端口那个）。
#   - 放在 `location / { ... }` 的旁边即可（同一层级），不用删除任何已有内容。
# 配置文件一般在 /etc/nginx/conf.d/mle.doge6.com.conf 或 /etc/nginx/sites-enabled/ 下，
# 用这条命令找：  grep -rl "mle.doge6.com" /etc/nginx/
#
# 改完后：  nginx -t && systemctl reload nginx

    # App 注册/注销设备、健康检查、后台接口
    location /api/push/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 8k;
        # 给很多设备发送时可能要几十秒
        proxy_read_timeout 130s;
    }

    # 推送后台页面（需要用户名密码登录）
    location = /push-admin {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 8k;
    }
