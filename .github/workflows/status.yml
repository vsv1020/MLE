name: App Store status

# Read-only: prints the app's review state, build, in-app purchase and recent builds.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [STATUS, scripts/asc-status.mjs]

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Status
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/key.p8"
          KEY_PATH="$RUNNER_TEMP/keys/key.p8" node scripts/asc-status.mjs
          rm -rf "$RUNNER_TEMP/keys"
