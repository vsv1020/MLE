name: Website

# Publishes site/ (home, privacy policy, terms, support) to GitHub Pages:
#   https://vsv1020.github.io/MLE/
# These are the URLs App Store Connect, the Google consent screen and the app's About screen
# link to. Runs on Ubuntu in well under a minute.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on (source: GitHub Actions) the first time, if the token is allowed to.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
