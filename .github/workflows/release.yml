name: Release to TestFlight

# Builds, signs and uploads VocabLoop to App Store Connect. Manual or on a version tag —
# every run
# spends macOS minutes (billed at 10x) and produces a real build in your account.
#
# One-time setup, all in your own Apple account (nobody else can do these):
#   1. Enrol in the Apple Developer Program.
#   2. App Store Connect ▸ Apps ▸ "+" ▸ New App, bundle ID `com.vocabloop.app`.
#   3. App Store Connect ▸ Users and Access ▸ Integrations ▸ App Store Connect API ▸
#      generate a key with the **Admin** role. Admin, not Developer: the build asks Apple
#      to create the distribution certificate and profile for it (cloud-managed signing),
#      and lesser roles are refused. Download the .p8 — it can only be downloaded once.
#   4. GitHub ▸ repo ▸ Settings ▸ Secrets and variables ▸ Actions, add:
#        APPLE_TEAM_ID      10-character Team ID (Membership details page)
#        ASC_KEY_ID         the key's ID
#        ASC_ISSUER_ID      the Issuer ID shown above the key list
#        ASC_KEY_P8         the full contents of the .p8 file, including BEGIN/END lines
#   5. Actions ▸ Release to TestFlight ▸ Run workflow.
#
# One-time setup for the widgets and Live Activity (1.0.8, docs/WIDGET-PLAN.md §3.1). The App
# Store Connect API cannot create an App Group or assign one to an App ID, so this is by hand,
# in developer.apple.com ▸ Certificates, Identifiers & Profiles ▸ Identifiers (about 3 minutes):
#   6. "+" ▸ App Groups ▸ register `group.com.vocabloop.app` (description "VocabLoop").
#   7. App IDs ▸ `com.vocabloop.app` ▸ App Groups ▸ enable ▸ Configure ▸ tick the group ▸ Save.
#   8. "+" ▸ App IDs ▸ App ▸ explicit `com.vocabloop.app.widgets` ("VocabLoop Widgets") ▸
#      App Groups ▸ Configure ▸ tick the group ▸ Register. (May be skipped: the "Provision
#      extension App ID" step registers the ID and enables the capability; only the tick in
#      Configure cannot be scripted — do that after the first run.)
#   Until then, ship without the extension: run with widgets = off, or set the repository
#   variable VL_WIDGETS=off (Settings ▸ Secrets and variables ▸ Actions ▸ Variables).

on:
  workflow_dispatch:
    inputs:
      widgets:
        description: 'Include the widget extension and Live Activity (off = ship 1.0.7-style, no App Group)'
        type: choice
        options: ['on', 'off']
        default: 'on'
  # Pushing a tag like `v1.0.0-b1` ships that commit. Deliberately a tag and not a branch:
  # every run creates a real build in App Store Connect, so it should take an explicit act.
  push:
    tags: ['v*']
    # Or: change the RELEASE file on main. Its first line is the version shown in the App
    # Store (MARKETING_VERSION); anything below is release notes, and editing them re-ships
    # the same version with a new build number.
    branches: [main]
    paths: [RELEASE]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    # Archive + upload is ~5 minutes; waiting for Apple to process the build is up to 40 more.
    timeout-minutes: 100
    env:
      # The manual input wins; tag and RELEASE pushes read the repository variable; default on.
      VL_WIDGETS: ${{ github.event.inputs.widgets || vars.VL_WIDGETS || 'on' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Select Xcode
        run: |
          # App Store Connect only accepts builds made with the iOS 26 SDK or later (Xcode 26+);
          # the first upload was rejected for being built with 18.5. Take the newest Xcode 26
          # on the image rather than pinning a point release that the image will eventually drop.
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner image"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Provision extension App ID
        # Registers com.vocabloop.app.widgets and enables App Groups on both App IDs, before any
        # Xcode step, so a provisioning gap fails in seconds. It cannot create or tick the group
        # itself — see the one-time steps 6–8 at the top of this file.
        if: env.VL_WIDGETS == 'on'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_BUNDLE_ID: com.vocabloop.app
          EXT_BUNDLE_ID: com.vocabloop.app.widgets
          APP_GROUP: group.com.vocabloop.app
        run: node scripts/asc-provision.mjs

      - name: Revoke development certificates left by earlier runs
        # Every run starts with an empty keychain, so automatic signing mints a new Apple
        # Development certificate and the old one is orphaned. Ten of them filled the account's
        # limit and blocked 1.0.7. Only development certificates "Created via API" (made by CI)
        # are revoked — never distribution certificates or ones made on a Mac — and revoking
        # them does not affect any build already uploaded.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MODE: prune
        run: node scripts/asc-certificates.mjs

      - name: Ship without widgets
        # The extension target stays in the project but is no longer a dependency or embedded,
        # and without the group entitlement SharedStorage falls back to Application Support
        # exactly as 1.0.7 did. Same commit, no code change.
        if: env.VL_WIDGETS == 'off'
        run: |
          python3 scripts/strip-widget-target.py
          plutil -remove com.apple.security.application-groups Config/VocabLoop.entitlements
          echo "Widgets: off — archiving the app alone"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Not a secret (an iOS OAuth client has none), so a repository *variable*. Empty
          # hides the Google button rather than shipping one that cannot work.
          # Either place works: it is easy to add it under Secrets by habit, and a build that
          # silently hides the button over which tab it went in is not worth the purity.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_ID }}
          # Where site/ is hosted, e.g. https://example.com/vocabloop/ — links to the privacy
          # policy, terms and support pages are hidden in builds without it.
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            echo "Google sign-in: configured (${#GOOGLE_CLIENT_ID} chars, ends ${GOOGLE_CLIENT_ID: -27})"
          else
            echo "Google sign-in: not configured — the button will be hidden"
          fi
          echo "Website: ${WEBSITE_URL:-not configured — legal links hidden}"
          # Build number = run number, so every upload is unique without editing the project.
          set -o pipefail
          xcodebuild archive \
            -project VocabLoop.xcodeproj \
            -scheme VocabLoop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VocabLoop.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="$(head -n1 RELEASE | tr -d '[:space:]')" \
            GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            WEBSITE_URL="$WEBSITE_URL" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|Provisioning|entitlement|warning: .*deprecated|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/VocabLoop.xcarchive" || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # destination=upload sends the build straight to App Store Connect; no separate
          # altool / Transporter step.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VocabLoop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Distribute to testers
        # Without this the build is uploaded but invisible: TestFlight only shows a build to
        # the testers of a group that contains it. 1.0.0 (2) went unseen for exactly that reason.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.vocabloop.app
          BUILD_NUMBER: ${{ github.run_number }}
          # Internal testers; must be users of the App Store Connect team. Space- or comma-separated.
          TESTFLIGHT_TESTERS: vsv.zhang@gmail.com
        run: |
          export APP_VERSION="$(head -n1 RELEASE | tr -d '[:space:]')"
          export WHATS_NEW="$(tail -n +2 RELEASE | sed '/./,$!d')"
          node scripts/testflight-distribute.mjs

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
