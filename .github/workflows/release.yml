name: Release to TestFlight

# Builds, signs and uploads VocabLoop to App Store Connect. Manual only — every run
# spends macOS minutes (billed at 10x) and produces a real build in your account.
#
# One-time setup, all in your own Apple account (nobody else can do these):
#   1. Enrol in the Apple Developer Program.
#   2. App Store Connect ▸ Apps ▸ "+" ▸ New App, bundle ID `com.vocabloop.app`.
#   3. App Store Connect ▸ Users and Access ▸ Integrations ▸ App Store Connect API ▸
#      generate a key with the **Admin** role. Admin, not Developer: the build asks Apple
#      to create the distribution certificate and profile for it (cloud-managed signing),
#      and lesser roles are refused. Download the .p8 — it can only be downloaded once.
#   4. GitHub ▸ repo ▸ Settings ▸ Secrets and variables ▸ Actions, add:
#        APPLE_TEAM_ID      10-character Team ID (Membership details page)
#        ASC_KEY_ID         the key's ID
#        ASC_ISSUER_ID      the Issuer ID shown above the key list
#        ASC_KEY_P8         the full contents of the .p8 file, including BEGIN/END lines
#   5. Actions ▸ Release to TestFlight ▸ Run workflow.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Build number = run number, so every upload is unique without editing the project.
          set -o pipefail
          xcodebuild archive \
            -project VocabLoop.xcodeproj \
            -scheme VocabLoop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VocabLoop.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*deprecated|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/VocabLoop.xcarchive" || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # destination=upload sends the build straight to App Store Connect; no separate
          # altool / Transporter step.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VocabLoop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
